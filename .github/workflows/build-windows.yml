name: Build Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build EXE with PyInstaller
        run: |
          pyinstaller --noconfirm --onedir --windowed --name "SmartCRM_Pro" --collect-all customtkinter smart_crm_pro.py

      - name: Zip Windows Build
        shell: pwsh
        run: Compress-Archive -Path dist/SmartCRM_Pro/* -DestinationPath SmartCRM_Pro_Windows.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartCRM_Pro_Windows
          path: SmartCRM_Pro_Windows.zip
